<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Keycap Gradient -->
    <linearGradient id="keycap-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3D40"/>
      <stop offset="50%" stop-color="#282A2D"/>
      <stop offset="100%" stop-color="#1A1C1E"/>
    </linearGradient>

    <!-- Keycap Top Surface Gradient -->
    <linearGradient id="keycap-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E3033"/>
      <stop offset="100%" stop-color="#202224"/>
    </linearGradient>

    <!-- Bevel Highlight -->
    <linearGradient id="bevel-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A5E63"/>
      <stop offset="60%" stop-color="#383A3D"/>
      <stop offset="100%" stop-color="#18191B"/>
    </linearGradient>

    <!-- Mint Status LED Glow (Active / Green) -->
    <radialGradient id="led-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA2" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#2EA44F" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#2EA44F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2EA44F" stop-opacity="0"/>
    </radialGradient>

    <!-- LED Jewel Core -->
    <linearGradient id="led-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B6FFD8"/>
      <stop offset="40%" stop-color="#2EA44F"/>
      <stop offset="100%" stop-color="#1C6832"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Inner Key Dish Filter -->
    <filter id="inner-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Outer Drop Shadow -->
  <rect x="12" y="14" width="104" height="104" rx="22" ry="22" fill="#000000" opacity="0.3" filter="url(#drop-shadow)"/>

  <!-- Keycap Base (Outer Skirt) -->
  <rect x="12" y="12" width="104" height="104" rx="22" ry="22" fill="url(#keycap-base)" stroke="url(#bevel-stroke)" stroke-width="2"/>

  <!-- Keycap Top Inset Surface -->
  <rect x="22" y="22" width="84" height="84" rx="14" ry="14" fill="url(#keycap-top)" stroke="#383A3D" stroke-width="1.5"/>

  <!-- Subtle Dish Highlight Line -->
  <path d="M 30 24 L 98 24" stroke="#484C52" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- CapsLock Symbol: Upward Chevron / Arrow with Base Bar -->
  <g id="caps-glyph" fill="#FFFFFF">
    <!-- Arrow Head -->
    <path d="M 64 36 L 44 56 L 54 56 L 54 72 L 74 72 L 74 56 L 84 56 Z" fill="#F0F2F5"/>
    <!-- Base Bar -->
    <rect x="44" y="78" width="40" height="7" rx="3.5" ry="3.5" fill="#F0F2F5"/>
  </g>

  <!-- Status LED Glow Halo -->
  <circle cx="86" cy="38" r="14" fill="url(#led-glow)"/>

  <!-- Status LED Lens / Core (Active Mint Green) -->
  <circle cx="86" cy="38" r="5" fill="url(#led-core)" stroke="#0E381A" stroke-width="0.8"/>
  <circle cx="84.5" cy="36.5" r="1.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
